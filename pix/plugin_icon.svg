<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Emerald Check Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Card Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="3" />

  <!-- Background Decorative Glowing Circles -->
  <circle cx="420" cy="90" r="80" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="90" cy="420" r="90" fill="#2563eb" opacity="0.18" filter="url(#glow)" />

  <!-- Split Screen Application Window -->
  <g filter="url(#dropShadow)">
    <!-- Main Window Frame -->
    <rect x="64" y="84" width="384" height="300" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Window Title Bar -->
    <path d="M 64 104 A 20 20 0 0 1 84 84 L 428 84 A 20 20 0 0 1 448 104 L 448 126 L 64 126 Z" fill="#0f172a" />
    
    <!-- Window Traffic Lights -->
    <circle cx="88" cy="105" r="5" fill="#f87171" />
    <circle cx="104" cy="105" r="5" fill="#fbbf24" />
    <circle cx="120" cy="105" r="5" fill="#34d399" />
    
    <!-- Title bar text/badge -->
    <rect x="170" y="99" width="172" height="12" rx="6" fill="#334155" opacity="0.8" />

    <!-- Left Pane: Document Viewer (60%) -->
    <rect x="74" y="136" width="224" height="238" rx="12" fill="#ffffff" />
    
    <!-- Document Content Preview Lines -->
    <!-- Document Header / Thumbnail -->
    <rect x="90" y="152" width="192" height="32" rx="6" fill="#e0f2fe" />
    <rect x="100" y="162" width="70" height="12" rx="3" fill="#0284c7" />
    <circle cx="266" cy="168" r="7" fill="#38bdf8" />

    <!-- Simulated Text Lines -->
    <rect x="90" y="196" width="170" height="8" rx="4" fill="#cbd5e1" />
    <rect x="90" y="212" width="192" height="8" rx="4" fill="#e2e8f0" />
    <rect x="90" y="228" width="150" height="8" rx="4" fill="#e2e8f0" />
    <rect x="90" y="244" width="180" height="8" rx="4" fill="#cbd5e1" />

    <!-- Simulated Image / Chart in document -->
    <rect x="90" y="264" width="192" height="92" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Mountain/Image vector inside doc -->
    <path d="M 102 338 L 138 296 L 168 324 L 204 280 L 254 338 Z" fill="#93c5fd" opacity="0.7" />
    <circle cx="235" cy="292" r="10" fill="#f59e0b" opacity="0.85" />

    <!-- Split Divider Line -->
    <line x1="308" y1="136" x2="308" y2="374" stroke="#334155" stroke-width="2" />

    <!-- Right Pane: Grading Form (40%) -->
    <rect x="316" y="136" width="122" height="238" rx="12" fill="#f8fafc" />
    
    <!-- Grading Panel Header -->
    <rect x="326" y="152" width="102" height="14" rx="4" fill="#cbd5e1" />

    <!-- Grade Score Card -->
    <rect x="326" y="176" width="102" height="54" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
    <text x="377" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#059669" text-anchor="middle">100 / A</text>

    <!-- Feedback Checklist items -->
    <rect x="326" y="242" width="18" height="18" rx="5" fill="#10b981" />
    <path d="M 330 251 L 333 255 L 340 246" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="350" y="247" width="78" height="8" rx="4" fill="#cbd5e1" />

    <rect x="326" y="268" width="18" height="18" rx="5" fill="#10b981" />
    <path d="M 330 277 L 333 281 L 340 272" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="350" y="273" width="65" height="8" rx="4" fill="#cbd5e1" />

    <!-- Save Grade Action Button -->
    <rect x="326" y="304" width="102" height="26" rx="6" fill="#2563eb" />
    <text x="377" y="321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Save Grade</text>
  </g>

  <!-- Floating Glowing Preview Eye Lens Badge (Bottom Center-Right) -->
  <g filter="url(#dropShadow)" transform="translate(350, 340)">
    <circle cx="45" cy="45" r="46" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="4" />
    <!-- Eye Icon -->
    <path d="M 23 45 C 31 33, 59 33, 67 45 C 59 57, 31 57, 23 45 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="45" cy="45" r="8" fill="#ffffff" />
    <circle cx="48" cy="42" r="2.5" fill="#2563eb" />
  </g>

  <!-- Supported File Type Badges (Bottom Left) -->
  <g transform="translate(68, 412)">
    <!-- PDF Badge -->
    <rect x="0" y="0" width="60" height="26" rx="6" fill="#ef4444" />
    <text x="30" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PDF</text>
    
    <!-- DOCX Badge -->
    <rect x="68" y="0" width="64" height="26" rx="6" fill="#2563eb" />
    <text x="100" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DOCX</text>

    <!-- XLSX Badge -->
    <rect x="140" y="0" width="60" height="26" rx="6" fill="#10b981" />
    <text x="170" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">XLSX</text>

    <!-- IMG Badge -->
    <rect x="208" y="0" width="58" height="26" rx="6" fill="#f59e0b" />
    <text x="237" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">IMG</text>

    <!-- PPTX Badge -->
    <rect x="274" y="0" width="62" height="26" rx="6" fill="#ea580c" />
    <text x="305" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PPTX</text>
  </g>
</svg>
